name: release

# A tag `v*` builds EON Tasks for Windows, Linux and macOS with the pinned
# toolchain, runs --selftest on the binary about to be published, and
# publishes it with its manifest and SHA256SUMS.txt -- the files
# eon-office-marketplace lists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: windows-latest, platform: windows-x86_64, suffix: .exe }
          - { os: ubuntu-latest, platform: linux-x86_64, suffix: "" }
          - { os: macos-latest, platform: macos-aarch64, suffix: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup show
      - run: cargo build --release
      - name: Self-test the binary about to be published
        shell: bash
        run: target/release/eon-tasks${{ matrix.suffix }} --selftest report.txt || { cat report.txt; exit 1; }
      - name: Stage
        shell: bash
        run: |
          mkdir dist
          cp "target/release/eon-tasks${{ matrix.suffix }}" "dist/eon-tasks-${GITHUB_REF_NAME}-${{ matrix.platform }}${{ matrix.suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cp manifest.json "dist/eon-tasks-${GITHUB_REF_NAME}-manifest.json"
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "EON Tasks $GITHUB_REF_NAME" --notes-file .github/release-notes.md
