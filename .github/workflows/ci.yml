name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # EON Tasks on the EON Office library in a private home folder: nothing else runs.
      - run: cargo test
      - name: Self-test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          target/debug/eon-tasks.exe --selftest report.txt || { cat report.txt; exit 1; }
          cat report.txt
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: "22"
      - name: Drive the real window
        if: runner.os == 'Windows'
        shell: bash
        run: node tools/ui-check.mjs --tasks target/debug/eon-tasks.exe --shots shots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: interface-screenshots
          path: shots
          if-no-files-found: ignore

  invariants:
    name: project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The interface has no network of its own
        run: |
          if grep -rIn -E '\b(fetch|XMLHttpRequest|WebSocket|EventSource|importScripts)\s*\(' src | grep -vE ':[[:space:]]*(//|/\*|\*)'; then
            echo "::error::the interface is reaching the network directly"
            exit 1
          fi
      - name: Untrusted text never becomes markup
        run: |
          if grep -rIn -E 'innerHTML|outerHTML\s*=|insertAdjacentHTML|document\.write' src; then
            echo "::error::markup from strings -- use textContent"
            exit 1
          fi
      - name: No telemetry (madde 36)
        run: |
          if grep -rIn -iE 'telemetry|analytics|sentry|mixpanel|posthog' src src-tauri/src src-tauri/Cargo.toml; then
            echo "::error::telemetry-shaped code found"
            exit 1
          fi
      - name: Only the plugins decided on
        # Each plugin widens what the program can do; madde 43's design note allows
        # single-instance and, in applications that remind, notification. Nothing
        # that gives the interface files, a shell or the network.
        run: |
          if grep -nE '^\s*tauri-plugin-' src-tauri/Cargo.toml | grep -vE 'tauri-plugin-(single-instance|notification) '; then
            echo "::error::a tauri plugin that was not decided on"
            exit 1
          fi
      - name: Stands alone
        # EON Tasks never needs a running service: no SDK client, no socket.
        run: |
          if grep -rnE 'eon-office-sdk|TcpStream|connect_app' src-tauri/Cargo.toml src-tauri/src; then
            echo "::error::EON Tasks must not depend on a running service"
            exit 1
          fi

  deny:
    name: licences · advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check all

  reuse:
    name: licence headers (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  dco:
    name: signed-off commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry Signed-off-by
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::missing Signed-off-by: $(git log -1 --oneline "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          exit $missing
