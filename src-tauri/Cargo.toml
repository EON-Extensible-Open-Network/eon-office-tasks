[package]
name = "eon-office-tasks"
version.workspace = true
description = "EON Tasks: tasks, subtasks, repeating tasks, lists, a board, reminders and iCalendar import and export, on the EON Office core."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "eon_tasks"
path = "src/lib.rs"

[[bin]]
name = "eon-tasks"
path = "src/main.rs"

# Every dependency is a supply-chain commitment (madde 37).
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The window (madde 2): the system webview, no plugins.
tauri = { version = "2", features = [] }
# The protocol client; the tasks live in the core, not in this program.
eon-office-sdk = { git = "https://github.com/EON-Extensible-Open-Network/eon-office-sdk", rev = "b38bd6b8ef57583bfd4cc1ca8ee9acbd8d9d5c6c", version = "0.1.0" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"
