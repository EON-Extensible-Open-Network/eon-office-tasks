#
# EON Tasks. `src/` is the interface (static HTML, CSS, JavaScript; no Node,
# no bundler). `src-tauri/` is the host: a library (`tasks`, on the EON Office
# library) and the window over it.
[workspace]
members = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/EON-Extensible-Open-Network/eon-office-tasks"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
