# cargo-deny: supply chain and licence gate (madde 37).
# A dependency is a commitment; this file makes the commitment explicit.

[advisories]
yanked = "deny"
# RUSTSEC-2024-0370 -- proc-macro-error is unmaintained. Not a vulnerability: a
# notice that fixes will stop coming. Checked rather than waved through: it is a
# procedural macro, so it runs in the compiler at build time and none of it is in
# the shipped binary; the only path is glib-macros 0.18 -> glib -> gtk 0.18, the
# GTK 3 bindings Tauri uses on Linux only (cargo tree -i proc-macro-error
# --target x86_64-unknown-linux-gnu). Windows and macOS builds do not contain it.
# Remove this when Tauri's Linux stack leaves gtk-rs 0.18.
#
# RUSTSEC-2026-0370, -0371, -0372 -- zvariant, zbus_names and zvariant_derive are
# unmaintained *as separate crates*: they were merged into zbus 6 (its `wire` and
# `names` modules). Not vulnerabilities. Reached only on Linux, through zbus 5,
# which tauri-plugin-single-instance uses to find the running window over D-Bus
# (and notify-rust, behind tauri-plugin-notification, to post notifications)
# (cargo tree -i zvariant --target x86_64-unknown-linux-gnu). Windows and macOS
# builds do not contain them. Remove these when the plugins move to zbus 6.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Our own crates are copyleft and unpublished; the allow list below governs
# DEPENDENCIES, which must stay permissive.
private = { ignore = true }

# GPL-3.0-or-later project: permissive inbound licences only. A copyleft
# dependency with a different reciprocity than ours is a decision, not a default,
# and must be added here deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The SDK is pinned to a commit of our own repository (src-tauri/Cargo.toml).
allow-git = ["https://github.com/EON-Extensible-Open-Network/eon-office-core"]
